name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit is on main branch
        run: |
          git fetch origin main --depth=50
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Refusing to publish tag not contained in origin/main" >&2
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify tag matches pyproject.toml version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -c '
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["TAG_NAME"]
          if actual != expected:
              sys.exit(f"Tag {actual!r} does not match pyproject.toml version {expected!r}")
          '
      - run: pip install -e ".[all,dev]"
      - run: ruff check .
      - run: black --check .
      - run: isort --check .
      - run: mypy py_momo_sdk/ tests/
      - run: bandit -r py_momo_sdk/ -ll
      - run: pip-audit --skip-editable --desc

  verify:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[cli,dev]"
      - run: pytest --cov=py_momo_sdk --cov-report=term-missing

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install ".[release]"
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test built wheel in isolated environment
        run: |
          python -m venv /tmp/wheel-core
          /tmp/wheel-core/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-core/bin/python -c "import py_momo_sdk; assert py_momo_sdk.__version__ != '0.0.0'"
          cd "${GITHUB_WORKSPACE}"
          python -m venv /tmp/wheel-cli
          WHEEL=$(ls dist/*.whl | head -n 1)
          /tmp/wheel-cli/bin/pip install "${WHEEL}[cli]"
          cd /tmp
          /tmp/wheel-cli/bin/py-momo-sdk --version
      - name: Record artifact SHA-256 digests
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - name: Verify artifact SHA-256 digests
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          rm SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
