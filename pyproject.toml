[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "py-momo-sdk"
version = "1.1.0"
description = "Py MoMo SDK: Python client for the MTN Mobile Money (MoMo) and Airtel Money APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Wesley Kambale"},
]
keywords = ["mtn", "momo", "airtel", "mobile money", "africa", "fintech", "payments"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.0,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.23",
    "mypy>=2.4.1",
    "ruff>=0.4",
    "black>=26.10.1",
    "isort>=5",
    "bandit>=1.7",
    "build>=1.2,<2",
    "pre-commit>=4.6.2",
]
docs = [
    "mkdocs-material>=9.5,<10",
]
release = [
    "build>=1.2,<2",
    "twine>=7,<8",
]

[project.scripts]
py-momo-sdk = "py_momo_sdk._cli:app"

[project.urls]
Homepage = "https://wkambale.github.io/pymomo/"
Repository = "https://github.com/wkambale/pymomo"
Documentation = "https://wkambale.github.io/pymomo/"
Changelog = "https://github.com/wkambale/pymomo/blob/main/CHANGELOG.md"

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["py_momo_sdk"]

[tool.coverage.report]
fail_under = 90

[tool.isort]
profile = "black"

[tool.hatch.build]
exclude = [
    ".env",
    ".env.*",
    "*.pem",
    "*.key",
    "*.p12",
]

[tool.hatch.build.targets.sdist]
include = [
    "/py_momo_sdk",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["py_momo_sdk"]
