[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "py-momo-sdk"
version = "1.2.0"
description = "Py MoMo SDK: Typed Python client for African mobile money and payment APIs (MTN MoMo, Airtel Money, Wave, Safaricom M-Pesa, Paystack, Flutterwave, Orange Money)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Wesley Kambale"},
]
keywords = [
    "mtn",
    "momo",
    "airtel",
    "wave",
    "mpesa",
    "daraja",
    "paystack",
    "flutterwave",
    "orange-money",
    "mobile-money",
    "africa",
    "fintech",
    "payments",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12,<1",
]
airtel = [
    "cryptography>=42,<47",
]
fastapi = [
    "starlette>=0.37,<1",
    "fastapi>=0.111,<1",
]
django = [
    "django>=4.2,<7",
]
all = [
    "typer>=0.12,<1",
    "cryptography>=42,<47",
    "starlette>=0.37,<1",
    "fastapi>=0.111,<1",
    "django>=4.2,<7",
]
dev = [
    "typer>=0.12,<1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "pytest-asyncio>=1.5.0",
    "mypy>=2.4.1",
    "ruff>=0.17.5",
    "black>=26.10.1",
    "isort>=9.0.2",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1,<3",
    "build>=1.6.1,<2",
    "pre-commit>=4.6.2",
]
docs = [
    "mkdocs-material>=9.7.7,<10",
]
release = [
    "build>=1.6.1,<2",
    "twine>=7,<8",
]

[project.scripts]
py-momo-sdk = "py_momo_sdk._cli:app"

[project.urls]
Homepage = "https://wkambale.github.io/pymomo/"
Repository = "https://github.com/wkambale/pymomo"
Documentation = "https://wkambale.github.io/pymomo/"
Changelog = "https://github.com/wkambale/pymomo/blob/main/CHANGELOG.md"

[tool.mypy]
strict = true
python_version = "3.10"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
disable_error_code = ["attr-defined", "call-arg"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM", "RUF", "S"]
ignore = ["E501", "S105", "S106", "S110"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["py_momo_sdk"]

[tool.coverage.report]
fail_under = 90

[tool.isort]
profile = "black"

[tool.hatch.build]
exclude = [
    ".env",
    ".env.*",
    "*.pem",
    "*.key",
    "*.p12",
    "*.pfx",
    "*.p8",
    "*.jks",
    "*.keystore",
    "*.crt",
    "*.der",
    "*.sqlite*",
    "*.db",
    "*.log",
    "AGENTS.md",
    "principles.md",
    "research.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "/py_momo_sdk",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["py_momo_sdk"]
