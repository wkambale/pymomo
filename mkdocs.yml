site_name: Py MoMo SDK
site_description: Production-grade, strictly typed Python client library for MTN Mobile Money and Airtel Money APIs.
site_url: https://wkambale.github.io/pymomo/
repo_url: https://github.com/wkambale/pymomo
repo_name: wkambale/pymomo
copyright: Copyright &copy; 2026 Wesley Kambale
docs_dir: docs
site_dir: site

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/scroll.js

nav:
  - Home: index.md
  - Guides:
      - Quickstart: quickstart.md
      - Authentication: authentication.md
      - Sandbox provisioning: sandbox.md
      - Webhooks: webhooks.md
      - Async support: async.md
      - Error handling: error-handling.md
  - Products:
      - Collection: collection.md
      - Disbursement: disbursement.md
      - Remittance: remittance.md
      - Airtel Money: airtel.md
  - Reference:
      - CLI: cli.md
      - Changelog: changelog.md
      - Contributing: contributing.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
