site_name: PyMoMo
site_url: https://pymomo.github.io
repo_url: https://github.com/pymomo/pymomo
repo_name: pymomo/pymomo

theme:
  name: material
  palette:
    - scheme: default
      primary: yellow
      accent: yellow
  features:
    - navigation.instant
    - navigation.tabs
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Authentication: authentication.md
  - Products:
      - Collection: collection.md
      - Disbursement: disbursement.md
      - Remittance: remittance.md
  - Sandbox: sandbox.md
  - Webhooks: webhooks.md
  - Async support: async.md
  - Error handling: error-handling.md
  - CLI: cli.md
  - Changelog: changelog.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
